name: Major Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачивает всю историю с тегами

      - name: Calculate and create Major Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Находим последний тег вида vX.Y.Z
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            # Извлекаем цифры из vX.Y.Z
            RAW_VER="${LATEST_TAG#v}"
            MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
            NEW_MAJOR=$((MAJOR + 1))
            NEW_TAG="v${NEW_MAJOR}.0.0"
          fi

          echo "Creating Major release: $NEW_TAG"
          gh release create "$NEW_TAG" --generate-notes --title "$NEW_TAG"