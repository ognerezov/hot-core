name: Patch Release on Push

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate and create Patch Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v0.0.1"
          else
            RAW_VER="${LATEST_TAG#v}"
            MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
            MINOR=$(echo "$RAW_VER" | cut -d. -f2)
            PATCH=$(echo "$RAW_VER" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          echo "Creating Patch release: $NEW_TAG"
          gh release create "$NEW_TAG" --generate-notes --title "$NEW_TAG"